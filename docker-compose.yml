services:
  torrent-feed:
    build: .
    image: torrent-feed:latest
    container_name: torrent-feed
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Required. Generate one with: openssl rand -base64 32
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      TZ: ${TZ:-UTC}
    volumes:
      # SQLite database + cached images. On TrueNAS use a dataset path, e.g. /mnt/tank/apps/torrent-feed
      - ${DATA_PATH:-./data}:/data
    # On TrueNAS the "apps" user is 568. Uncomment and chown the dataset to 568:568.
    # user: "568:568"
