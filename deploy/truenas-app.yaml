services:
  torrent-feed:
    image: torrent-feed:latest
    pull_policy: never          # image was loaded locally; never try to pull it
    restart: unless-stopped
    user: "568:568"             # TrueNAS "apps" user
    ports:
      - "8080:8080"
    environment:
      API_TOKEN: "REPLACE_WITH_YOUR_TOKEN"
      TZ: "America/New_York"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - /mnt/POOL/apps/torrent-feed:/data   # replace POOL with your pool name
